<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 35" width="120" height="35" fill="none">
  <!-- Minimalist Zen Prismatic Filter Gate (Template in Soft Aqua #70C1B3) -->
  <defs>
    <filter id="gateGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Translucent Glassmorphic Body -->
  <rect x="1" y="1" width="118" height="33" rx="6" fill="#70C1B3" fill-opacity="0.18" />

  <!-- Luminescent Prismatic Border -->
  <rect x="1" y="1" width="118" height="33" rx="6" stroke="#70C1B3" stroke-width="1.5" stroke-opacity="0.75" filter="url(#gateGlow)" />

  <!-- Center Jewel Resonance Core Pip -->
  <circle cx="60" cy="17.5" r="2.5" fill="#70C1B3" />
  <circle cx="60" cy="17.5" r="5.5" stroke="#70C1B3" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Soft Threshold Entry/Exit Subtle Guides -->
  <line x1="12" y1="6" x2="12" y2="29" stroke="#70C1B3" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 3" />
  <line x1="108" y1="6" x2="108" y2="29" stroke="#70C1B3" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 3" />
</svg>
