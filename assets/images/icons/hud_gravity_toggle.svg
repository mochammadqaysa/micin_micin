  <!-- Upward arrow (right) -->
  <line x1="16" y1="19" x2="16" y2="6" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="13 9 16 6 19 9" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
