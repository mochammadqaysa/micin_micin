<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 56" width="40" height="56" fill="none">
  <!-- Minimalist Zen Target Vessel (Template) -->
  <defs>
    <linearGradient id="cupInnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B21" />
      <stop offset="100%" stop-color="#1D232B" />
    </linearGradient>
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cup Basalt Body with 8px rounded bottom corners -->
  <path d="M 0 0 L 0 48 Q 0 56 8 56 L 32 56 Q 40 56 40 48 L 40 0 Z" fill="url(#cupInnerGrad)" />

  <!-- Beveled Rim & Outer Contour -->
  <path d="M 0 0 L 0 48 Q 0 56 8 56 L 32 56 Q 40 56 40 48 L 40 0" stroke="#F4A7B9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Aperture Membrane with soft glow -->
  <line x1="2" y1="1" x2="38" y2="1" stroke="#F4A7B9" stroke-width="1.5" stroke-opacity="0.75" filter="url(#rimGlow)" />

  <!-- Center Target Numeral Placeholder (100) in Outfit Geometric Style -->
  <text x="20" y="32" fill="#F4A7B9" font-family="Outfit, sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">100</text>
</svg>
